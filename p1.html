<!DOCTYPE html>
<html>
<body data-page="p1">

<h2>Question 1</h2>

<!-- TIMER -->
<div id="timer" style="font-size:18px;color:red"></div>

<!-- QUESTION -->
<p>
WHAT IS USED TO DESIGN CACHE MEMORY.
</p>

<!-- INPUT -->
<input id="ans" placeholder="Answer">
<button onclick="check()">Submit</button>

<!-- MESSAGE -->
<p id="msg"></p>

<script>
const solvedKey = "solved_p1";

// Lock page if already solved
if (localStorage.getItem(solvedKey) === "true") {
  document.getElementById("ans").disabled = true;
  document.querySelector("button").disabled = true;
  document.getElementById("msg").innerText =
    "✅ Answer already accepted. Go to the next location.";
}

function check() {
  const CORRECT_ANSWER = "Static ram";
  const user = document.getElementById("ans").value
    .trim()
    .toUpperCase();

  if (user === CORRECT_ANSWER) {

    // ✅ stop timer + protection safely
    onSolveSuccess();

    // save solved status locally
    localStorage.setItem(solvedKey, "true");

    // update Google Sheet
    fetch(`${API}?action=solve&team=${team}&page=${PAGE}`)
      .then(() => {
        document.getElementById("msg").innerText =
          "✅ Correct! Go to quadrangle and search for the next QR.";
      });

  } else {
    document.getElementById("msg").innerText = "❌ Wrong answer";
  }
}
</script>

<!-- GLOBAL SECURITY + TIMER -->
<script src="/hunter/secure.js"></script>

</body>
</html>
