<!DOCTYPE html>
<html>
<body data-page="p3">

<h2>Question 3</h2>
<div id="timer" style="font-size:18px;color:red"></div>
<p>gO TO nss ROOM
  

</p>

<input id="ans">
<button onclick="check()">Submit</button>
<p id="msg"></p>

<script>
  function check() {
  const CORRECT_ANSWER = "15"; // 👈 change per location
  const user = document.getElementById("ans").value
               .trim()
               .toUpperCase();

  if (user === CORRECT_ANSWER) {

    // 🛑 STOP TIMER
    timerStopped = true;
    clearInterval(timerInterval);


    // ✅ SAVE SUCCESS TO SHEET
    fetch(${API}?action=solve&team=${team}&page=${PAGE})
      .then(() => {
        document.getElementById("msg").innerText =
          "✅ Correct! Move ahead to the next location parking area and Scan the next Qr.";
      });

  } else {
    document.getElementById("msg").innerText = "❌ Wrong answer";
  }
}
</script>

</body>
</html>
