<!DOCTYPE html>
<html>
<body data-page="p9">

<h2>Question 9</h2>
<div id="timer" style="font-size:18px;color:red"></div>
<p>
  code here in lab


</p>

<input id="ans">
<button onclick="check()">Submit</button>
<p id="msg"></p>

<script>


  function check() {
  const CORRECT_ANSWER = ""CS lab"||"cs lab"||"cs Laboratory"||"CS Laboratory""; // 👈 change per location
  const user = document.getElementById("ans").value
               .trim()
               .toUpperCase();

  if (user === CORRECT_ANSWER) {

    // 🛑 STOP TIMER
    timerStopped = true;
    clearInterval(timerInterval);

    // 🔓 DISABLE ALL ANTI-CHEAT PROTECTION
    disableProtection();

    // ✅ SAVE SUCCESS TO SHEET
    fetch(${API}?action=solve&team=${team}&page=${PAGE})
      .then(() => {
        document.getElementById("msg").innerText =
          "✅ Correct! 😎 come to Cs Lab dude🤗 for last part of this game."";
      });

  } else {
    document.getElementById("msg").innerText = "❌ Wrong answer";
  }
}
</script>

<script src="/hunter/secure.js"></script>
</body>
</html>
